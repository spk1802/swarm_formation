# BTP thesis Chapter 7: chosen combination (start_swarm.sh --btp chosen).
# eps-fix speed law, full Delta, arccos field (r_min = 20 m), saturation reaching
# law, arccos leader. Gains match BTP1_runs (params_nominal.py + factor choices).
leader:
  ros__parameters:
    vf_field: arccos
    vf_K: 0.1299
    vf_C: 0.1667            # 1 / (0.300 r_min)
    vf_beta: 0.7854
    vf_eps: 1.0
    vf_omega_max: 10.0

follower_controller:
  ros__parameters:
    enable_delta: true
    enable_delta_dot: true
    speed_law: epsfix
    eps_den: 0.05
    field: arccos
    k_y: 0.1299
    field_C: 0.1667
    k_D: 1.0
    reaching: sat
    eta: 0.7854
    mu: 0.7854
    eps_sat: 1.0
    min_speed: 0.5
    max_speed: 8.0
    max_accel: 3.0
    max_yaw_rate: 1.5
